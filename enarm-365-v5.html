<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ENARM · Frase diaria y calendario</title>

  <style>
    @font-face {
      font-family: "EB Garamond";
      src: url("./EBGaramond-VariableFont_wght.ttf") format("truetype");
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
    }

    @font-face {
      font-family: "EB Garamond";
      src: url("./EBGaramond-Italic-VariableFont_wght.ttf") format("truetype");
      font-style: italic;
      font-weight: 400 800;
      font-display: swap;
    }

    :root {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #827e76;
      --past: #66645f;
      --past-alt: #807d75;
      --future: #eeedea;
      --future-alt: #e1e0dc;
      --today: #c66b4e;
      --outline: #b45c41;
      --exam: #b64f54;
      --radius: 2px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #191919;
        --ink: #deddd8;
        --muted: #a5a199;
        --past: #b8b6b0;
        --past-alt: #9b9993;
        --future: #333332;
        --future-alt: #3e3e3b;
        --today: #d88b68;
        --outline: #e2a081;
        --exam: #d16b70;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--ink);
    }

    main {
      width: 100%;
      height: 100%;
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }

    .quote-panel {
      flex: none;
      align-self: center;
      width: 100%;
      max-width: 920px;
      padding: 0 12px;
      text-align: center;
    }

    .quote-panel[hidden] {
      display: none;
    }

    blockquote {
      font-family: "EB Garamond", Garamond, Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 26px;
      line-height: 1.22;
      margin: 0;
      text-wrap: pretty;
      overflow-wrap: break-word;
    }

    cite {
      display: block;
      font-family: "EB Garamond", Garamond, Georgia, serif;
      font-style: normal;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.25;
      margin-top: 9px;
      color: var(--muted);
      overflow-wrap: break-word;
    }

    #calendar {
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
    }

    .day {
      position: absolute;
      background: var(--future);
      border-radius: var(--radius);
    }

    .day[data-month-tone="alternate"] {
      background: var(--future-alt);
    }

    .day.past {
      background: var(--past);
    }

    .day.past[data-month-tone="alternate"] {
      background: var(--past-alt);
    }

    .day.today,
    .day.today[data-month-tone="alternate"] {
      background: var(--today);
      box-shadow: inset 0 0 0 1px var(--outline);
      z-index: 2;
      animation: today-pulse 2.8s ease-in-out infinite;
    }

    .day.today::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 1px solid var(--today);
      border-radius: 3px;
      pointer-events: none;
      animation: today-halo 2.8s ease-out infinite;
    }

    .day.exam:not(.today):not(.past) {
      background: var(--background);
      box-shadow: inset 0 0 0 1.5px var(--exam);
      overflow: hidden;
    }

    .day.exam:not(.today):not(.past)::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 1px;
      background: var(--exam);
      pointer-events: none;
      animation: exam-breathe 6s ease-in-out infinite;
    }

    @keyframes exam-breathe {
      0%, 100% {
        opacity: 0.42;
      }

      50% {
        opacity: 0.66;
      }
    }

    @keyframes today-pulse {
      0%, 100% {
        filter: brightness(1);
        transform: scale(1);
      }

      28% {
        filter: brightness(1.22);
        transform: scale(1.09);
      }

      65% {
        filter: brightness(1);
        transform: scale(1);
      }
    }

    @keyframes today-halo {
      0% {
        opacity: 0;
        transform: scale(1);
      }

      18% {
        opacity: 0.65;
        transform: scale(1.05);
      }

      78%, 100% {
        opacity: 0;
        transform: scale(1.75);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .day.today,
      .day.today::after,
      .day.exam:not(.today):not(.past)::before {
        animation: none;
      }

      .day.today::after {
        display: none;
      }

      .day.exam:not(.today):not(.past)::before {
        opacity: 0.54;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="quote-panel" aria-label="Frase del día" hidden>
      <blockquote id="quote"></blockquote>
      <cite id="author"></cite>
    </section>

    <div
      id="calendar"
      role="img"
      aria-label="365 días de preparación para el ENARM; el último cuadro rojo representa el examen"
    ></div>
  </main>

  <script>
    "use strict";

    const TARGET_DATE = "2027-09-27";
    const TIME_ZONE = "America/Monterrey";
    const DAYS = 365;
    const DAY_MS = 86400000;
    const QUOTES_URL = "./frases.md";

    // Mantener estos valores para conservar la secuencia común.
    const ROTATION_START = "2026-10-17";
    const ROTATION_SEED = "enarm-frases-2027-v1";

    const [ry, rm, rd] = ROTATION_START.split("-").map(Number);
    const rotationStartDay = Date.UTC(ry, rm - 1, rd) / DAY_MS;

    const formatter = new Intl.DateTimeFormat("en-US", {
      timeZone: TIME_ZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    });

    function civilDay(now = new Date()) {
      const parts = Object.fromEntries(
        formatter.formatToParts(now)
          .filter(part => part.type !== "literal")
          .map(part => [part.type, part.value])
      );

      return Date.UTC(
        +parts.year,
        +parts.month - 1,
        +parts.day
      ) / DAY_MS;
    }

    const [year, month, day] = TARGET_DATE.split("-").map(Number);
    const targetDay = Date.UTC(year, month - 1, day) / DAY_MS;
    const startDay = targetDay - DAYS + 1;

    const calendar = document.getElementById("calendar");
    const panel = document.querySelector(".quote-panel");
    const quoteText = document.getElementById("quote");
    const authorText = document.getElementById("author");
    const fragment = document.createDocumentFragment();

    let monthIndex = 0;
    let previousMonth = "";

    const cells = Array.from({ length: DAYS }, (_, index) => {
      const cell = document.createElement("span");

      cell.className = index === DAYS - 1 ? "day exam" : "day";
      cell.setAttribute("aria-hidden", "true");

      cell.dataset.date = new Date((startDay + index) * DAY_MS)
        .toISOString()
        .slice(0, 10);

      const cellMonth = cell.dataset.date.slice(0, 7);

      if (previousMonth && previousMonth !== cellMonth) {
        monthIndex++;
      }

      cell.dataset.monthTone = monthIndex % 2
        ? "alternate"
        : "base";

      previousMonth = cellMonth;
      fragment.appendChild(cell);

      return cell;
    });

    calendar.appendChild(fragment);

    // Lee el formato del Markdown adjunto sin ejecutar HTML.
    function parseQuotes(markdown) {
      const result = [];
      const seen = new Set();
      let lines = [];

      for (const raw of markdown.split(/\r?\n/)) {
        const match = raw.match(/^\s*>\s?(.*)$/);

        if (!match) continue;

        const line = match[1].trim();

        if (/^[—–]\s+/.test(line)) {
          const text = lines.join(" ")
            .trim()
            .replace(/^\*([\s\S]*)\*$/, "$1")
            .trim();

          const author = line.replace(/^[—–]\s+/, "").trim();
          const id = JSON.stringify([text, author]);

          if (text && author && !seen.has(id)) {
            seen.add(id);
            result.push({ id, text, author });
          }

          lines = [];
        } else if (line) {
          lines.push(line);
        }
      }

      return result;
    }

    let quotes = [];
    let lastRenderedDay = null;

    // Generador reproducible: misma semilla, mismo resultado.
    function seededRandom(seed) {
      let state = 2166136261;

      for (let i = 0; i < seed.length; i++) {
        state = Math.imul(state ^ seed.charCodeAt(i), 16777619);
      }

      return () => {
        state = (state + 0x6D2B79F5) | 0;

        let value = Math.imul(
          state ^ (state >>> 15),
          1 | state
        );

        value ^= value + Math.imul(
          value ^ (value >>> 7),
          61 | value
        );

        return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffledQuotes(list) {
      // Reordenar las entradas del Markdown no cambia la secuencia.
      const deck = [...list].sort((a, b) =>
        a.id < b.id ? -1 : a.id > b.id ? 1 : 0
      );

      const random = seededRandom(ROTATION_SEED);

      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      return deck;
    }

    function chooseQuote(today) {
      const elapsed = today - rotationStartDay;
      const index = (
        (elapsed % quotes.length) + quotes.length
      ) % quotes.length;

      return quotes[index];
    }

    function update() {
      const today = civilDay();

      if (lastRenderedDay === today) return;

      cells.forEach((cell, index) => {
        cell.classList.toggle("past", startDay + index < today);
        cell.classList.toggle("today", startDay + index === today);
      });

      if (quotes.length) {
        const quote = chooseQuote(today);

        quoteText.textContent = quote.text;
        authorText.textContent = "— " + quote.author;
        panel.hidden = false;
      }

      lastRenderedDay = today;
      layout();
    }

    function arrange(size, width) {
      const gap = size * 0.25;

      const columns = Math.max(
        1,
        Math.floor((width + gap + 0.00001) / (size + gap))
      );

      const rows = Math.ceil(DAYS / columns);
      const occupiedColumns = Math.min(DAYS, columns);

      return {
        columns,
        gap,
        width: occupiedColumns * size + (occupiedColumns - 1) * gap,
        height: rows * size + (rows - 1) * gap
      };
    }

    function layout() {
      if (!panel.hidden) {
        // Ajustar el texto y reservar espacio para el calendario.
        const available = Math.max(
          0,
          document.querySelector("main").clientHeight - 48
        );

        const budget = Math.max(
          0,
          Math.min(180, available * 0.5)
        );

        const maximum = Math.min(
          30,
          Math.max(20, panel.clientWidth / 32)
        );

        let low = 10;
        let high = maximum;

        for (let i = 0; i < 12; i++) {
          const middle = (low + high) / 2;

          quoteText.style.fontSize = middle + "px";
          authorText.style.fontSize =
            Math.max(11, middle * 0.65) + "px";

          if (panel.getBoundingClientRect().height <= budget) {
            low = middle;
          } else {
            high = middle;
          }
        }

        quoteText.style.fontSize = low + "px";
        authorText.style.fontSize =
          Math.max(11, low * 0.65) + "px";
      }

      const width = calendar.clientWidth;
      const height = calendar.clientHeight;

      if (width <= 0 || height <= 0) return;

      let low = 0;
      let high = Math.min(width, height);

      for (let i = 0; i < 40; i++) {
        const middle = (low + high) / 2;

        if (arrange(middle, width).height <= height) {
          low = middle;
        } else {
          high = middle;
        }
      }

      const size = low;
      const grid = arrange(size, width);
      const offsetX = Math.max(0, (width - grid.width) / 2);
      const offsetY = Math.max(0, (height - grid.height) / 2);

      cells.forEach((cell, index) => {
        Object.assign(cell.style, {
          width: size + "px",
          height: size + "px",
          left: (
            offsetX +
            (index % grid.columns) * (size + grid.gap)
          ) + "px",
          top: (
            offsetY +
            Math.floor(index / grid.columns) * (size + grid.gap)
          ) + "px"
        });
      });
    }

    let frame;

    function requestLayout() {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(layout);
    }

    new ResizeObserver(requestLayout)
      .observe(document.documentElement);

    document.fonts.ready.then(requestLayout);

    update();

    async function loadQuotes() {
      try {
        const response = await fetch(QUOTES_URL, {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            "No se pudo cargar frases.md: " + response.status
          );
        }

        const parsed = parseQuotes(await response.text());

        if (!parsed.length) {
          throw new Error("No se encontraron frases con autor.");
        }

        quotes = shuffledQuotes(parsed);
        lastRenderedDay = null;

        update();
        document.fonts.ready.then(requestLayout);
      } catch (error) {
        console.error(error);
      }
    }

    loadQuotes();

    setInterval(() => {
      const changed = lastRenderedDay !== civilDay();

      update();

      if (changed) {
        loadQuotes();
      }
    }, 1000);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) update();
    });

    window.addEventListener("pageshow", update);
  </script>
</body>
</html>
