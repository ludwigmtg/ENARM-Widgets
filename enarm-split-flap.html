<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ENARM · Split-flap countdown</title>

  <style>
    @font-face {
      font-family: "EB Garamond";
      src: url("./EBGaramond-VariableFont_wght.ttf") format("truetype");
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
    }

    :root {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #98958e;
      --accent: #c66b4e;
      --upper: #f5f4f1;
      --lower: #eeede9;
      --seam: rgba(55, 53, 47, 0.18);
      --edge: rgba(55, 53, 47, 0.055);
      --hinge: #d1cec6;

      --heading-height: 12px;
      --heading-gap: 10px;
      --heading-font: 10px;
      --label-font: 8px;
      --label-height: 11px;
      --label-gap: 6px;
      --row-gap: 10px;
      --column-gap: 12px;
      --digit-gap: 4px;
      --label-width: 42px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #191919;
        --ink: #deddd8;
        --muted: #96928b;
        --accent: #d88b68;
        --upper: #30302e;
        --lower: #282826;
        --seam: rgba(0, 0, 0, 0.55);
        --edge: rgba(255, 255, 255, 0.04);
        --hinge: #55534e;
      }
    }

    :root[data-theme="light"] {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #98958e;
      --accent: #c66b4e;
      --upper: #f5f4f1;
      --lower: #eeede9;
      --seam: rgba(55, 53, 47, 0.18);
      --edge: rgba(55, 53, 47, 0.055);
      --hinge: #d1cec6;
    }

    :root[data-theme="dark"] {
      --background: #191919;
      --ink: #deddd8;
      --muted: #96928b;
      --accent: #d88b68;
      --upper: #30302e;
      --lower: #282826;
      --seam: rgba(0, 0, 0, 0.55);
      --edge: rgba(255, 255, 255, 0.04);
      --hinge: #55534e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: absolute;
      inset: 0 4px;
    }

    .countdown {
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: var(--heading-height);
      margin-bottom: var(--heading-gap);
      color: var(--muted);
    }

    .heading::before {
      content: "";
      width: 4px;
      height: 4px;
      flex: none;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: var(--heading-font);
      line-height: 1;
      font-weight: 500;
      letter-spacing: 1.2px;
      white-space: nowrap;
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: var(--column-gap);
      row-gap: var(--row-gap);
    }

    .group {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--label-gap);
    }

    .days {
      grid-column: 1 / -1;
    }

    .digits {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--digit-gap);
      flex: none;
      font-variant-numeric: lining-nums tabular-nums;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: var(--label-font);
      line-height: var(--label-height);
      font-weight: 400;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .digit {
      position: relative;
      flex: none;
      width: var(--digit-width, 30px);
      height: var(--digit-height, 44px);
      perspective: 600px;
      color: var(--ink);
      font-weight: 400;
      border-radius: var(--corner, 3px);
      background: var(--lower);
    }

    .days .digit {
      font-family: "EB Garamond", Garamond, Georgia, serif;
      font-weight: 450;
    }

    .seconds .glyph {
      opacity: 0.7;
    }

    .half {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .top {
      top: 0;
      background: var(--upper);
      border-radius:
        var(--corner, 3px)
        var(--corner, 3px)
        0 0;
      transform-origin: center bottom;
      box-shadow: inset 0 1px 0 var(--edge);
    }

    .bottom {
      top: 50%;
      background: var(--lower);
      border-radius:
        0 0
        var(--corner, 3px)
        var(--corner, 3px);
      transform-origin: center top;
      box-shadow: inset 0 -1px 0 var(--edge);
    }

    .glyph {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--digit-height, 44px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--number-size, 32px);
      line-height: 1;
      white-space: nowrap;
    }

    .bottom .glyph {
      top: calc(var(--digit-height, 44px) * -0.5);
    }

    .digit::before {
      content: "";
      position: absolute;
      top: calc(50% - 0.5px);
      left: 0;
      right: 0;
      height: 1px;
      background: var(--seam);
      z-index: 5;
      pointer-events: none;
    }

    .digit::after {
      content: "";
      position: absolute;
      top: calc(50% - 2px);
      left: -1px;
      width: 2px;
      height: 4px;
      border-radius: 1px;
      background: var(--hinge);
      box-shadow:
        calc(var(--digit-width, 30px) - 1px)
        0 0 var(--hinge);
      z-index: 6;
      pointer-events: none;
    }

    .outgoing {
      z-index: 3;
      animation:
        fold-out 230ms cubic-bezier(0.4, 0, 0.85, 0.4) both;
    }

    .incoming {
      z-index: 4;
      animation:
        fold-in 230ms 230ms cubic-bezier(0.15, 0.6, 0.35, 1) both;
    }

    /* Dos columnas cuando el bloque tiene un ancho intermedio. */
    :root[data-layout="compact"] .groups {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    :root[data-layout="compact"] .days {
      grid-column: auto;
    }

    /* Cuatro filas cuando el bloque es estrecho. */
    :root[data-layout="narrow"] .groups {
      grid-template-columns: minmax(0, 1fr);
    }

    :root[data-layout="narrow"] .group {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        var(--label-width);
      align-items: center;
      column-gap: var(--column-gap);
    }

    :root[data-layout="narrow"] .days {
      grid-column: auto;
    }

    :root[data-layout="narrow"] .digits {
      justify-self: center;
    }

    :root[data-layout="narrow"] .label {
      text-align: right;
      letter-spacing: 0.5px;
    }

    @keyframes fold-out {
      from {
        transform: rotateX(0deg);
        filter: brightness(1);
      }

      to {
        transform: rotateX(-90deg);
        filter: brightness(0.8);
      }
    }

    @keyframes fold-in {
      from {
        transform: rotateX(90deg);
        filter: brightness(0.8);
      }

      to {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .outgoing,
      .incoming {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <section
      class="countdown"
      aria-label="Cuenta regresiva para el ENARM"
    >
      <header class="heading">
        <h1>ENARM <span id="year">2027</span></h1>
      </header>

      <div class="groups">
        <div class="group days">
          <div
            class="digits"
            id="days"
            role="img"
            aria-label="Días restantes"
          ></div>
          <span class="label">DÍAS</span>
        </div>

        <div class="group hours">
          <div
            class="digits"
            id="hours"
            role="img"
            aria-label="Horas restantes"
          ></div>
          <span class="label">HORAS</span>
        </div>

        <div class="group minutes">
          <div
            class="digits"
            id="minutes"
            role="img"
            aria-label="Minutos restantes"
          ></div>
          <span class="label">MINUTOS</span>
        </div>

        <div class="group seconds">
          <div
            class="digits"
            id="seconds"
            role="img"
            aria-label="Segundos restantes"
          ></div>
          <span class="label">SEGUNDOS</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const TARGET_DATE = "2027-09-27";
    const TIME_ZONE = "America/Monterrey";

    const root = document.documentElement;
    const main = document.querySelector("main");

    const requestedTheme = new URLSearchParams(
      window.location.search
    ).get("theme");

    if (["light", "dark"].includes(requestedTheme)) {
      root.dataset.theme = requestedTheme;
    }

    const formatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: TIME_ZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    function localParts(date) {
      return Object.fromEntries(
        formatter.formatToParts(date)
          .filter(part => part.type !== "literal")
          .map(part => [part.type, Number(part.value)])
      );
    }

    function civilMilliseconds(parts) {
      return Date.UTC(
        parts.year,
        parts.month - 1,
        parts.day,
        parts.hour || 0,
        parts.minute || 0,
        parts.second || 0
      );
    }

    const [year, month, day] = TARGET_DATE.split("-").map(Number);
    const civilTarget = Date.UTC(year, month - 1, day);

    let target = civilTarget;

    for (let i = 0; i < 4; i++) {
      target += civilTarget - civilMilliseconds(
        localParts(new Date(target))
      );
    }

    document.getElementById("year").textContent = year;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const groups = [
      { id: "days", label: "días", length: 3 },
      { id: "hours", label: "horas", length: 2 },
      { id: "minutes", label: "minutos", length: 2 },
      { id: "seconds", label: "segundos", length: 2 }
    ].map(group => ({
      ...group,
      element: document.getElementById(group.id),
      container: document.querySelector("." + group.id),
      value: ""
    }));

    function remaining(now = Date.now()) {
      const total = Math.max(
        0,
        Math.ceil((target - now) / 1000)
      );

      return [
        Math.floor(total / 86400),
        Math.floor(total / 3600) % 24,
        Math.floor(total / 60) % 60,
        total % 60
      ];
    }

    function createHalf(position, value, extraClass = "") {
      const half = document.createElement("div");
      half.className = `half ${position} ${extraClass}`;

      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = value;

      half.appendChild(glyph);
      return half;
    }

    function settle(card, value) {
      clearTimeout(card.timer);

      card.replaceChildren(
        createHalf("top", value),
        createHalf("bottom", value)
      );
    }

    function animateDigit(card, previous, next) {
      settle(card, next);

      card.replaceChildren(
        createHalf("top", next),
        createHalf("bottom", previous),
        createHalf("top", previous, "outgoing"),
        createHalf("bottom", next, "incoming")
      );

      card.timer = setTimeout(() => {
        settle(card, next);
      }, 500);
    }

    function render(animate = true) {
      const values = remaining();
      let needsLayout = false;

      groups.forEach((group, index) => {
        const value = String(values[index]).padStart(
          group.length,
          "0"
        );

        if (value === group.value) return;

        const previous = group.value;

        if (previous.length !== value.length) {
          for (const card of group.element.children) {
            clearTimeout(card.timer);
          }

          group.element.replaceChildren();

          for (const digit of value) {
            const card = document.createElement("div");

            card.className = "digit";
            card.setAttribute("aria-hidden", "true");

            settle(card, digit);
            group.element.appendChild(card);
          }

          needsLayout = true;
        } else {
          Array.from(group.element.children).forEach((card, i) => {
            if (previous[i] === value[i]) return;

            if (animate && !reducedMotion.matches) {
              animateDigit(card, previous[i], value[i]);
            } else {
              settle(card, value[i]);
            }
          });
        }

        group.value = value;

        group.element.setAttribute(
          "aria-label",
          `${Number(value)} ${group.label} restantes`
        );
      });

      if (needsLayout) requestLayout();
    }

    function settleAll() {
      render(false);

      groups.forEach(group => {
        Array.from(group.element.children).forEach((card, index) => {
          settle(card, group.value[index]);
        });
      });
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function setPixels(name, value) {
      root.style.setProperty(name, value + "px");
    }

    function resize() {
      const width = main.clientWidth;
      const height = main.clientHeight;

      if (width <= 0 || height <= 0) return;

      let layout;

      if (width >= 300) {
        layout = "wide";
      } else if (width >= 200) {
        layout = "compact";
      } else {
        layout = "narrow";
      }

      root.dataset.layout = layout;

      const headingFont = Math.min(
        clamp(width * 0.045, 8, 12),
        height * 0.07
      );

      const headingHeight = headingFont * 1.2;

      const headingGap = Math.min(
        clamp(width * 0.035, 5, 12),
        height * 0.05
      );

      const labelFont = Math.min(
        clamp(width * 0.035, 7, 10),
        height * 0.045
      );

      const labelHeight = labelFont * 1.3;

      const labelGap = Math.min(
        clamp(width * 0.022, 4, 8),
        height * 0.035
      );

      const rowGap = Math.min(
        clamp(width * 0.035, 6, 16),
        height * 0.045
      );

      const columnGap = clamp(width * 0.04, 6, 16);
      const digitGap = clamp(width * 0.018, 2, 6);
      const labelWidth = labelFont * 5.5;

      setPixels("--heading-font", headingFont);
      setPixels("--heading-height", headingHeight);
      setPixels("--heading-gap", headingGap);
      setPixels("--label-font", labelFont);
      setPixels("--label-height", labelHeight);
      setPixels("--label-gap", labelGap);
      setPixels("--row-gap", rowGap);
      setPixels("--column-gap", columnGap);
      setPixels("--digit-gap", digitGap);
      setPixels("--label-width", labelWidth);

      const availableHeight = Math.max(
        1,
        height - headingHeight - headingGap
      );

      groups.forEach((group, index) => {
        const count = group.element.children.length || group.length;

        let cardHeight;
        let digitsWidth;

        if (layout === "narrow") {
          cardHeight = Math.max(
            1,
            (availableHeight - rowGap * 3) / 4
          );

          digitsWidth = Math.max(
            1,
            width - labelWidth - columnGap
          );
        } else if (layout === "compact") {
          cardHeight = Math.max(
            1,
            (
              availableHeight -
              rowGap -
              2 * (labelHeight + labelGap)
            ) / 2
          );

          const groupWidth = (width - columnGap) / 2;

          digitsWidth = Math.min(
            groupWidth,
            count * cardHeight * 0.78 + (count - 1) * digitGap
          );
        } else {
          const cardsHeight = Math.max(
            2,
            availableHeight -
            rowGap -
            2 * (labelHeight + labelGap)
          );

          cardHeight = index === 0
            ? cardsHeight * 0.66
            : cardsHeight * 0.34;

          const groupWidth = index === 0
            ? width
            : (width - columnGap * 2) / 3;

          digitsWidth = Math.min(
            groupWidth,
            count * cardHeight * 0.78 + (count - 1) * digitGap
          );
        }

        const cardWidth = Math.max(
          1,
          (digitsWidth - digitGap * (count - 1)) / count
        );

        const fontSize = index === 0
          ? Math.min(cardHeight * 0.98, cardWidth * 1.7)
          : Math.min(cardHeight * 0.74, cardWidth * 1.5);

        const style = group.container.style;

        style.setProperty("--digit-height", cardHeight + "px");
        style.setProperty("--digit-width", cardWidth + "px");
        style.setProperty("--number-size", fontSize + "px");

        style.setProperty(
          "--corner",
          clamp(cardHeight * 0.065, 2, 6) + "px"
        );
      });
    }

    let layoutFrame;

    function requestLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(resize);
    }

    function tick() {
      render(!document.hidden);

      setTimeout(
        tick,
        1000 - (Date.now() % 1000) + 5
      );
    }

    render(false);
    resize();
    tick();

    new ResizeObserver(requestLayout).observe(main);

    document.fonts.ready.then(requestLayout);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        settleAll();
        requestLayout();
      }
    });

    window.addEventListener("pageshow", () => {
      settleAll();
      requestLayout();
    });

    reducedMotion.addEventListener("change", settleAll);
  </script>
</body>
</html>
