<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ENARM · Split-flap countdown</title>

  <style>
    @font-face {
      font-family: "EB Garamond";
      src: url("./EBGaramond-VariableFont_wght.ttf") format("truetype");
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
    }

    :root {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #98958e;
      --accent: #c66b4e;
      --upper: #f5f4f1;
      --lower: #eeede9;
      --seam: rgba(55, 53, 47, 0.18);
      --edge: rgba(55, 53, 47, 0.055);
      --hinge: #d1cec6;

      --unit: 58px;
      --digit-gap: 4px;
      --heading-font: 10px;
      --heading-height: 12px;
      --heading-gap: 10px;
      --label-font: 8px;
      --label-height: 10px;
      --label-gap: 6px;
      --section-gap: 16px;
      --row-gap: 7px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #191919;
        --ink: #deddd8;
        --muted: #96928b;
        --accent: #d88b68;
        --upper: #30302e;
        --lower: #282826;
        --seam: rgba(0, 0, 0, 0.55);
        --edge: rgba(255, 255, 255, 0.04);
        --hinge: #55534e;
      }
    }

    :root[data-theme="light"] {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #98958e;
      --accent: #c66b4e;
      --upper: #f5f4f1;
      --lower: #eeede9;
      --seam: rgba(55, 53, 47, 0.18);
      --edge: rgba(55, 53, 47, 0.055);
      --hinge: #d1cec6;
    }

    :root[data-theme="dark"] {
      --background: #191919;
      --ink: #deddd8;
      --muted: #96928b;
      --accent: #d88b68;
      --upper: #30302e;
      --lower: #282826;
      --seam: rgba(0, 0, 0, 0.55);
      --edge: rgba(255, 255, 255, 0.04);
      --hinge: #55534e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: absolute;
      inset: 0 4px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .countdown {
      width: 100%;
      max-width: 400px;
      min-width: 0;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: var(--heading-height);
      margin-bottom: var(--heading-gap);
      color: var(--muted);
    }

    .heading::before {
      content: "";
      width: 4px;
      height: 4px;
      flex: none;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: var(--heading-font);
      line-height: 1;
      font-weight: 500;
      letter-spacing: 1.2px;
      white-space: nowrap;
    }

    .group {
      --digit-width: calc(var(--unit) * 0.44);
      --digit-height: calc(var(--unit) * 0.65);
      --number-size: calc(var(--unit) * 0.47);
      --corner: 3px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--label-gap);
      min-width: 0;
    }

    .hero {
      --digit-width: var(--unit);
      --digit-height: calc(var(--unit) * 1.5);
      --number-size: calc(var(--unit) * 1.5);
      --corner: 5px;
    }

    .digits {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--digit-gap);
      font-variant-numeric: lining-nums tabular-nums;
    }

    .label {
      color: var(--muted);
      font-size: var(--label-font);
      line-height: var(--label-height);
      font-weight: 400;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .hero .label {
      letter-spacing: 1.5px;
    }

    .details {
      width: min(100%, calc(var(--unit) * 4.4));
      margin: var(--section-gap) auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 8px;
    }

    .seconds .glyph {
      opacity: 0.7;
    }

    .digit {
      position: relative;
      flex: none;
      width: var(--digit-width);
      height: var(--digit-height);
      perspective: 600px;
      color: var(--ink);
      font-weight: 400;
      border-radius: var(--corner);
      background: var(--lower);
    }

    .hero .digit {
      font-family: "EB Garamond", Garamond, Georgia, serif;
      font-weight: 450;
    }

    .half {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .top {
      top: 0;
      background: var(--upper);
      border-radius: var(--corner) var(--corner) 0 0;
      transform-origin: center bottom;
      box-shadow: inset 0 1px 0 var(--edge);
    }

    .bottom {
      top: 50%;
      background: var(--lower);
      border-radius: 0 0 var(--corner) var(--corner);
      transform-origin: center top;
      box-shadow: inset 0 -1px 0 var(--edge);
    }

    .glyph {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--digit-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--number-size);
      line-height: 1;
      white-space: nowrap;
    }

    .bottom .glyph {
      top: calc(var(--digit-height) * -0.5);
    }

    .digit::before {
      content: "";
      position: absolute;
      top: calc(50% - 0.5px);
      left: 0;
      right: 0;
      height: 1px;
      background: var(--seam);
      z-index: 5;
      pointer-events: none;
    }

    .digit::after {
      content: "";
      position: absolute;
      top: calc(50% - 2px);
      left: -1px;
      width: 2px;
      height: 4px;
      border-radius: 1px;
      background: var(--hinge);
      box-shadow:
        calc(var(--digit-width) - 1px) 0 0 var(--hinge);
      z-index: 6;
      pointer-events: none;
    }

    .outgoing {
      z-index: 3;
      animation:
        fold-out 230ms cubic-bezier(0.4, 0, 0.85, 0.4) both;
    }

    .incoming {
      z-index: 4;
      animation:
        fold-in 230ms 230ms cubic-bezier(0.15, 0.6, 0.35, 1) both;
    }

    /* Los días permanecen grandes arriba.
       Solo se reorganizan las unidades pequeñas. */
    :root[data-layout="narrow"] .details {
      width: min(100%, 190px);
      grid-template-columns: minmax(0, 1fr);
      row-gap: var(--row-gap);
    }

    :root[data-layout="narrow"] .details .group {
      flex-direction: row;
      justify-content: space-between;
      gap: 8px;
    }

    :root[data-layout="narrow"] .details .label {
      text-align: right;
      letter-spacing: 0.6px;
    }

    @keyframes fold-out {
      from {
        transform: rotateX(0deg);
        filter: brightness(1);
      }

      to {
        transform: rotateX(-90deg);
        filter: brightness(0.8);
      }
    }

    @keyframes fold-in {
      from {
        transform: rotateX(90deg);
        filter: brightness(0.8);
      }

      to {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .outgoing,
      .incoming {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <section
      class="countdown"
      aria-label="Cuenta regresiva para el ENARM"
    >
      <header class="heading">
        <h1>ENARM <span id="year">2027</span></h1>
      </header>

      <div class="group hero">
        <div
          class="digits"
          id="days"
          role="img"
          aria-label="Días restantes"
        ></div>
        <span class="label">DÍAS</span>
      </div>

      <div class="details">
        <div class="group hours">
          <div
            class="digits"
            id="hours"
            role="img"
            aria-label="Horas restantes"
          ></div>
          <span class="label">HORAS</span>
        </div>

        <div class="group minutes">
          <div
            class="digits"
            id="minutes"
            role="img"
            aria-label="Minutos restantes"
          ></div>
          <span class="label">MINUTOS</span>
        </div>

        <div class="group seconds">
          <div
            class="digits"
            id="seconds"
            role="img"
            aria-label="Segundos restantes"
          ></div>
          <span class="label">SEGUNDOS</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const TARGET_DATE = "2027-09-27";
    const TIME_ZONE = "America/Monterrey";

    const root = document.documentElement;
    const main = document.querySelector("main");
    const countdown = document.querySelector(".countdown");

    const requestedTheme = new URLSearchParams(
      window.location.search
    ).get("theme");

    if (["light", "dark"].includes(requestedTheme)) {
      root.dataset.theme = requestedTheme;
    }

    const formatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: TIME_ZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    function localParts(date) {
      return Object.fromEntries(
        formatter.formatToParts(date)
          .filter(part => part.type !== "literal")
          .map(part => [part.type, Number(part.value)])
      );
    }

    function civilMilliseconds(parts) {
      return Date.UTC(
        parts.year,
        parts.month - 1,
        parts.day,
        parts.hour || 0,
        parts.minute || 0,
        parts.second || 0
      );
    }

    const [year, month, day] = TARGET_DATE.split("-").map(Number);
    const civilTarget = Date.UTC(year, month - 1, day);

    let target = civilTarget;

    for (let i = 0; i < 4; i++) {
      target += civilTarget - civilMilliseconds(
        localParts(new Date(target))
      );
    }

    document.getElementById("year").textContent = year;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const groups = [
      { id: "days", label: "días", length: 3 },
      { id: "hours", label: "horas", length: 2 },
      { id: "minutes", label: "minutos", length: 2 },
      { id: "seconds", label: "segundos", length: 2 }
    ].map(group => ({
      ...group,
      element: document.getElementById(group.id),
      value: ""
    }));

    function remaining(now = Date.now()) {
      const total = Math.max(
        0,
        Math.ceil((target - now) / 1000)
      );

      return [
        Math.floor(total / 86400),
        Math.floor(total / 3600) % 24,
        Math.floor(total / 60) % 60,
        total % 60
      ];
    }

    function createHalf(position, value, extraClass = "") {
      const half = document.createElement("div");
      half.className = `half ${position} ${extraClass}`;

      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = value;

      half.appendChild(glyph);
      return half;
    }

    function settle(card, value) {
      clearTimeout(card.timer);

      card.replaceChildren(
        createHalf("top", value),
        createHalf("bottom", value)
      );
    }

    function animateDigit(card, previous, next) {
      settle(card, next);

      card.replaceChildren(
        createHalf("top", next),
        createHalf("bottom", previous),
        createHalf("top", previous, "outgoing"),
        createHalf("bottom", next, "incoming")
      );

      card.timer = setTimeout(() => {
        settle(card, next);
      }, 500);
    }

    function render(animate = true) {
      const values = remaining();
      let needsLayout = false;

      groups.forEach((group, index) => {
        const value = String(values[index]).padStart(
          group.length,
          "0"
        );

        if (value === group.value) return;

        const previous = group.value;

        if (previous.length !== value.length) {
          for (const card of group.element.children) {
            clearTimeout(card.timer);
          }

          group.element.replaceChildren();

          for (const digit of value) {
            const card = document.createElement("div");
            card.className = "digit";
            card.setAttribute("aria-hidden", "true");

            settle(card, digit);
            group.element.appendChild(card);
          }

          needsLayout = true;
        } else {
          Array.from(group.element.children).forEach((card, i) => {
            if (previous[i] === value[i]) return;

            if (animate && !reducedMotion.matches) {
              animateDigit(card, previous[i], value[i]);
            } else {
              settle(card, value[i]);
            }
          });
        }

        group.value = value;

        group.element.setAttribute(
          "aria-label",
          `${Number(value)} ${group.label} restantes`
        );
      });

      if (needsLayout) requestLayout();
    }

    function settleAll() {
      render(false);

      groups.forEach(group => {
        Array.from(group.element.children).forEach((card, index) => {
          settle(card, group.value[index]);
        });
      });
    }

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function resize() {
      const width = countdown.clientWidth;
      const height = main.clientHeight;

      if (width <= 0 || height <= 0) return;

      const narrow = width < 220;

      root.dataset.layout = narrow ? "narrow" : "wide";

      const headingFont = clamp(width * 0.035, 8, 11);
      const headingHeight = headingFont * 1.2;
      const headingGap = clamp(width * 0.035, 6, 10);

      const labelFont = clamp(width * 0.026, 7, 9);
      const labelHeight = labelFont * 1.3;
      const labelGap = 5;
      const sectionGap = narrow ? 12 : 16;
      const rowGap = 7;

      root.style.setProperty(
        "--heading-font",
        headingFont + "px"
      );

      root.style.setProperty(
        "--heading-height",
        headingHeight + "px"
      );

      root.style.setProperty(
        "--heading-gap",
        headingGap + "px"
      );

      root.style.setProperty("--label-font", labelFont + "px");
      root.style.setProperty("--label-height", labelHeight + "px");
      root.style.setProperty("--label-gap", labelGap + "px");
      root.style.setProperty("--section-gap", sectionGap + "px");
      root.style.setProperty("--row-gap", rowGap + "px");

      // Buscar el mayor tamaño que cabe sin cambiar las proporciones.
      let low = 1;
      let high = 90;

      for (let i = 0; i < 24; i++) {
        const unit = (low + high) / 2;
        const digitGap = Math.max(2, unit * 0.07);

        root.style.setProperty("--unit", unit + "px");
        root.style.setProperty("--digit-gap", digitGap + "px");

        const heroWidth =
          document.getElementById("days").scrollWidth;

        const details = document.querySelector(".details");

        const detailsFit = Array.from(
          details.querySelectorAll(".group")
        ).every(group => group.scrollWidth <= group.clientWidth + 0.5);

        const fits =
          heroWidth <= width - 2 &&
          countdown.scrollHeight <= height + 0.5 &&
          detailsFit;

        if (fits) {
          low = unit;
        } else {
          high = unit;
        }
      }

      root.style.setProperty("--unit", low + "px");
      root.style.setProperty(
        "--digit-gap",
        Math.max(2, low * 0.07) + "px"
      );
    }

    let layoutFrame;

    function requestLayout() {
      cancelAnimationFrame(layoutFrame);
      layoutFrame = requestAnimationFrame(resize);
    }

    function tick() {
      render(!document.hidden);

      setTimeout(
        tick,
        1000 - (Date.now() % 1000) + 5
      );
    }

    render(false);
    resize();
    tick();

    new ResizeObserver(requestLayout).observe(main);

    document.fonts.ready.then(requestLayout);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        settleAll();
        requestLayout();
      }
    });

    window.addEventListener("pageshow", () => {
      settleAll();
      requestLayout();
    });

    reducedMotion.addEventListener("change", settleAll);
  </script>
</body>
</html>
