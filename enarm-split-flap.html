<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ENARM · Split-flap countdown</title>

  <style>
    @font-face {
      font-family: "EB Garamond";
      src: url("./EBGaramond-VariableFont_wght.ttf") format("truetype");
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
    }

    :root {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #98958e;
      --accent: #c66b4e;
      --upper: #f5f4f1;
      --lower: #eeede9;
      --seam: rgba(55, 53, 47, 0.18);
      --edge: rgba(55, 53, 47, 0.055);
      --hinge: #d1cec6;

      --scale: 1;
      --base-width: 300px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #191919;
        --ink: #deddd8;
        --muted: #96928b;
        --accent: #d88b68;
        --upper: #30302e;
        --lower: #282826;
        --seam: rgba(0, 0, 0, 0.55);
        --edge: rgba(255, 255, 255, 0.04);
        --hinge: #55534e;
      }
    }

    :root[data-theme="light"] {
      --background: #ffffff;
      --ink: #37352f;
      --muted: #98958e;
      --accent: #c66b4e;
      --upper: #f5f4f1;
      --lower: #eeede9;
      --seam: rgba(55, 53, 47, 0.18);
      --edge: rgba(55, 53, 47, 0.055);
      --hinge: #d1cec6;
    }

    :root[data-theme="dark"] {
      --background: #191919;
      --ink: #deddd8;
      --muted: #96928b;
      --accent: #d88b68;
      --upper: #30302e;
      --lower: #282826;
      --seam: rgba(0, 0, 0, 0.55);
      --edge: rgba(255, 255, 255, 0.04);
      --hinge: #55534e;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: var(--background);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: absolute;
      inset: 0 4px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .countdown {
      width: min(
        100%,
        calc(var(--base-width) * var(--scale))
      );
      min-width: 0;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(7px * var(--scale));
      height: calc(12px * var(--scale));
      margin-bottom: calc(10px * var(--scale));
      color: var(--muted);
    }

    .heading::before {
      content: "";
      width: calc(4px * var(--scale));
      height: calc(4px * var(--scale));
      flex: none;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: calc(10px * var(--scale));
      line-height: 1;
      font-weight: 500;
      letter-spacing: calc(1.6px * var(--scale));
      white-space: nowrap;
    }

    .groups {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: calc(12px * var(--scale));
      row-gap: calc(16px * var(--scale));
    }

    .group {
      --digit-height: calc(40px * var(--scale));
      --digit-width: calc(27px * var(--scale));
      --number-size: calc(28px * var(--scale));
      --corner: calc(3px * var(--scale));

      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(6px * var(--scale));
    }

    .days {
      --digit-height: calc(94px * var(--scale));
      --digit-width: calc(58px * var(--scale));
      --number-size: calc(94px * var(--scale));
      --corner: calc(5px * var(--scale));

      grid-column: 1 / -1;
    }

    .digits {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: calc(4px * var(--scale));
      font-variant-numeric: lining-nums tabular-nums;
    }

    .days .digits {
      gap: calc(6px * var(--scale));
    }

    .label {
      color: var(--muted);
      font-size: calc(8px * var(--scale));
      line-height: calc(10px * var(--scale));
      font-weight: 400;
      letter-spacing: calc(1.15px * var(--scale));
      white-space: nowrap;
    }

    .days .label {
      font-size: calc(9px * var(--scale));
      letter-spacing: calc(1.5px * var(--scale));
    }

    .seconds .glyph {
      opacity: 0.7;
    }

    .digit {
      position: relative;
      flex: none;
      width: var(--digit-width);
      height: var(--digit-height);
      perspective: 500px;
      color: var(--ink);
      font-weight: 400;
      border-radius: var(--corner);
      background: var(--lower);
    }

    .days .digit {
      font-family: "EB Garamond", Garamond, Georgia, serif;
      font-weight: 450;
    }

    .half {
      position: absolute;
      left: 0;
      right: 0;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .top {
      top: 0;
      background: var(--upper);
      border-radius: var(--corner) var(--corner) 0 0;
      transform-origin: center bottom;
      box-shadow: inset 0 1px 0 var(--edge);
    }

    .bottom {
      top: 50%;
      background: var(--lower);
      border-radius: 0 0 var(--corner) var(--corner);
      transform-origin: center top;
      box-shadow: inset 0 -1px 0 var(--edge);
    }

    .glyph {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--digit-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--number-size);
      line-height: 1;
      white-space: nowrap;
    }

    .bottom .glyph {
      top: calc(var(--digit-height) * -0.5);
    }

    /* Ranura central. */
    .digit::before {
      content: "";
      position: absolute;
      top: calc(50% - 0.5px);
      left: 0;
      right: 0;
      height: 1px;
      background: var(--seam);
      z-index: 5;
      pointer-events: none;
    }

    /* Ejes laterales. */
    .digit::after {
      content: "";
      position: absolute;
      top: calc(50% - 2px);
      left: -1px;
      width: 2px;
      height: 4px;
      border-radius: 1px;
      background: var(--hinge);
      box-shadow:
        calc(var(--digit-width) - 1px) 0 0 var(--hinge);
      z-index: 6;
      pointer-events: none;
    }

    .outgoing {
      z-index: 3;
      animation:
        fold-out 230ms cubic-bezier(0.4, 0, 0.85, 0.4) both;
    }

    .incoming {
      z-index: 4;
      animation:
        fold-in 230ms 230ms cubic-bezier(0.15, 0.6, 0.35, 1) both;
    }

    /* Espacio mediano: cuadrícula de 2 × 2. */
    :root[data-layout="compact"] .groups {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: calc(12px * var(--scale));
    }

    :root[data-layout="compact"] .group {
      --digit-height: calc(62px * var(--scale));
      --digit-width: calc(35px * var(--scale));
      --number-size: calc(43px * var(--scale));
      --corner: calc(4px * var(--scale));

      gap: calc(5px * var(--scale));
    }

    :root[data-layout="compact"] .days {
      --digit-width: calc(29px * var(--scale));
      --number-size: calc(56px * var(--scale));

      grid-column: auto;
    }

    :root[data-layout="compact"] .days .digits {
      gap: calc(3px * var(--scale));
    }

    :root[data-layout="compact"] .days .label {
      font-size: calc(8px * var(--scale));
      letter-spacing: calc(1.15px * var(--scale));
    }

    /* Espacio estrecho: una unidad por fila. */
    :root[data-layout="narrow"] .groups {
      grid-template-columns: minmax(0, 1fr);
      row-gap: calc(8px * var(--scale));
    }

    :root[data-layout="narrow"] .group {
      --digit-height: calc(36px * var(--scale));
      --digit-width: calc(23px * var(--scale));
      --number-size: calc(26px * var(--scale));
      --corner: calc(3px * var(--scale));

      flex-direction: row;
      justify-content: space-between;
      gap: calc(8px * var(--scale));
    }

    :root[data-layout="narrow"] .days {
      --digit-width: calc(24px * var(--scale));
      --number-size: calc(36px * var(--scale));

      grid-column: auto;
    }

    :root[data-layout="narrow"] .digits {
      gap: calc(3px * var(--scale));
    }

    :root[data-layout="narrow"] .label {
      font-size: calc(7px * var(--scale));
      letter-spacing: calc(0.7px * var(--scale));
      text-align: right;
    }

    :root[data-layout="narrow"] h1 {
      font-size: calc(9px * var(--scale));
      letter-spacing: calc(1px * var(--scale));
    }

    @keyframes fold-out {
      from {
        transform: rotateX(0deg);
        filter: brightness(1);
      }

      to {
        transform: rotateX(-90deg);
        filter: brightness(0.8);
      }
    }

    @keyframes fold-in {
      from {
        transform: rotateX(90deg);
        filter: brightness(0.8);
      }

      to {
        transform: rotateX(0deg);
        filter: brightness(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .outgoing,
      .incoming {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <section
      class="countdown"
      aria-label="Cuenta regresiva para el ENARM"
    >
      <header class="heading">
        <h1>ENARM <span id="year">2027</span></h1>
      </header>

      <div class="groups">
        <div class="group days">
          <div
            class="digits"
            id="days"
            role="img"
            aria-label="Días restantes"
          ></div>
          <span class="label">DÍAS</span>
        </div>

        <div class="group hours">
          <div
            class="digits"
            id="hours"
            role="img"
            aria-label="Horas restantes"
          ></div>
          <span class="label">HORAS</span>
        </div>

        <div class="group minutes">
          <div
            class="digits"
            id="minutes"
            role="img"
            aria-label="Minutos restantes"
          ></div>
          <span class="label">MINUTOS</span>
        </div>

        <div class="group seconds">
          <div
            class="digits"
            id="seconds"
            role="img"
            aria-label="Segundos restantes"
          ></div>
          <span class="label">SEGUNDOS</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    // Fecha estimada del examen.
    // La cuenta termina a las 00:00 de Monterrey.
    const TARGET_DATE = "2027-09-27";
    const TIME_ZONE = "America/Monterrey";

    const root = document.documentElement;

    const requestedTheme = new URLSearchParams(
      window.location.search
    ).get("theme");

    if (["light", "dark"].includes(requestedTheme)) {
      root.dataset.theme = requestedTheme;
    }

    const formatter = new Intl.DateTimeFormat("en-GB", {
      timeZone: TIME_ZONE,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    });

    function localParts(date) {
      return Object.fromEntries(
        formatter.formatToParts(date)
          .filter(part => part.type !== "literal")
          .map(part => [part.type, Number(part.value)])
      );
    }

    function civilMilliseconds(parts) {
      return Date.UTC(
        parts.year,
        parts.month - 1,
        parts.day,
        parts.hour || 0,
        parts.minute || 0,
        parts.second || 0
      );
    }

    const [year, month, day] = TARGET_DATE.split("-").map(Number);
    const civilTarget = Date.UTC(year, month - 1, day);

    let target = civilTarget;

    for (let i = 0; i < 4; i++) {
      target += civilTarget - civilMilliseconds(
        localParts(new Date(target))
      );
    }

    document.getElementById("year").textContent = year;

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    const groups = [
      { id: "days", label: "días", length: 3 },
      { id: "hours", label: "horas", length: 2 },
      { id: "minutes", label: "minutos", length: 2 },
      { id: "seconds", label: "segundos", length: 2 }
    ].map(group => ({
      ...group,
      element: document.getElementById(group.id),
      value: ""
    }));

    function remaining(now = Date.now()) {
      const total = Math.max(
        0,
        Math.ceil((target - now) / 1000)
      );

      return [
        Math.floor(total / 86400),
        Math.floor(total / 3600) % 24,
        Math.floor(total / 60) % 60,
        total % 60
      ];
    }

    function createHalf(position, value, extraClass = "") {
      const half = document.createElement("div");
      half.className = `half ${position} ${extraClass}`;

      const glyph = document.createElement("span");
      glyph.className = "glyph";
      glyph.textContent = value;

      half.appendChild(glyph);
      return half;
    }

    function settle(card, value) {
      clearTimeout(card.timer);

      card.replaceChildren(
        createHalf("top", value),
        createHalf("bottom", value)
      );
    }

    function animateDigit(card, previous, next) {
      settle(card, next);

      card.replaceChildren(
        createHalf("top", next),
        createHalf("bottom", previous),
        createHalf("top", previous, "outgoing"),
        createHalf("bottom", next, "incoming")
      );

      card.timer = setTimeout(() => {
        settle(card, next);
      }, 500);
    }

    function render(animate = true) {
      const values = remaining();

      groups.forEach((group, index) => {
        const value = String(values[index]).padStart(
          group.length,
          "0"
        );

        if (value === group.value) return;

        const previous = group.value;

        if (previous.length !== value.length) {
          for (const card of group.element.children) {
            clearTimeout(card.timer);
          }

          group.element.replaceChildren();

          for (const digit of value) {
            const card = document.createElement("div");

            card.className = "digit";
            card.setAttribute("aria-hidden", "true");

            settle(card, digit);
            group.element.appendChild(card);
          }
        } else {
          Array.from(group.element.children).forEach((card, i) => {
            if (previous[i] === value[i]) return;

            if (animate && !reducedMotion.matches) {
              animateDigit(card, previous[i], value[i]);
            } else {
              settle(card, value[i]);
            }
          });
        }

        group.value = value;

        group.element.setAttribute(
          "aria-label",
          `${Number(value)} ${group.label} restantes`
        );
      });
    }

    function settleAll() {
      render(false);

      groups.forEach(group => {
        Array.from(group.element.children).forEach((card, index) => {
          settle(card, group.value[index]);
        });
      });
    }

    function resize() {
      const width = Math.max(1, root.clientWidth - 8);
      const height = Math.max(1, root.clientHeight);

      let layout;
      let baseWidth;
      let baseHeight;

      if (width >= 260) {
        layout = "wide";
        baseWidth = 300;
        baseHeight = 204;
      } else if (width >= 150) {
        layout = "compact";
        baseWidth = 220;
        baseHeight = 190;
      } else {
        layout = "narrow";
        baseWidth = 140;
        baseHeight = 190;
      }

      const scale = Math.max(
        0.01,
        Math.min(
          width / baseWidth,
          height / baseHeight,
          1.35
        )
      );

      root.dataset.layout = layout;
      root.style.setProperty("--base-width", baseWidth + "px");
      root.style.setProperty("--scale", scale);
    }

    function tick() {
      render(!document.hidden);

      setTimeout(
        tick,
        1000 - (Date.now() % 1000) + 5
      );
    }

    resize();
    render(false);
    tick();

    new ResizeObserver(resize).observe(root);

    document.fonts.ready.then(resize);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) settleAll();
    });

    window.addEventListener("pageshow", settleAll);
    reducedMotion.addEventListener("change", settleAll);
  </script>
</body>
</html>
