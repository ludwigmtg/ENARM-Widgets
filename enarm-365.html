<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ENARM · 365 días</title>
  <style>
    :root {
      --background: #ffffff;
      --past: #66645f;
      --future: #eeedea;
      --today: #c66b4e;
      --outline: #b45c41;
      --radius: 2px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #191919;
        --past: #b8b6b0;
        --future: #333332;
        --today: #d88b68;
        --outline: #e2a081;
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--background); }
    main {
      width: 100%; height: 100%; padding: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    #calendar { display: grid; flex: none; }
    .day { background: var(--future); border-radius: var(--radius); }
    .day.past { background: var(--past); }
    .day.today {
      background: var(--today);
      box-shadow: inset 0 0 0 1px var(--outline);
    }
  </style>
</head>
<body>
  <main>
    <div id="calendar" role="img" aria-label="Calendario visual de preparación para el ENARM"></div>
  </main>
  <script>
    'use strict';
    // CONFIGURACIÓN: fecha estimada, editable; el día del examen queda excluido.
    const TARGET_DATE = '2027-09-27';
    const TIME_ZONE = 'America/Monterrey';
    const DAYS = 365;
    const DAY_MS = 86400000;
    // Aritmética de fechas civiles en UTC: evita desfases por horario de verano.
    const [year, month, day] = TARGET_DATE.split('-').map(Number);
    const targetDay = Date.UTC(year, month - 1, day) / DAY_MS;
    const startDay = targetDay - DAYS;
    const formatter = new Intl.DateTimeFormat('en-US', {
      timeZone: TIME_ZONE, year: 'numeric', month: '2-digit', day: '2-digit'
    });
    function civilDay(now) {
      const parts = Object.fromEntries(formatter.formatToParts(now)
        .filter(part => part.type !== 'literal').map(part => [part.type, part.value]));
      return Date.UTC(+parts.year, +parts.month - 1, +parts.day) / DAY_MS;
    }
    const calendar = document.getElementById('calendar');
    const fragment = document.createDocumentFragment();
    const cells = Array.from({ length: DAYS }, (_, index) => {
      const cell = document.createElement('span');
      cell.className = 'day';
      cell.setAttribute('aria-hidden', 'true');
      cell.dataset.date = new Date((startDay + index) * DAY_MS).toISOString().slice(0, 10);
      fragment.appendChild(cell);
      return cell;
    });
    calendar.appendChild(fragment);
    let lastDay;
    function update() {
      const today = civilDay(new Date());
      if (today === lastDay) return;
      lastDay = today;
      cells.forEach((cell, index) => {
        const date = startDay + index;
        cell.className = date < today ? 'day past' : date === today ? 'day today' : 'day';
      });
    }
    function resize() {
      const width = Math.max(1, document.documentElement.clientWidth - 24);
      const height = Math.max(1, document.documentElement.clientHeight - 24);
      // Retícula horizontal; cuadrados iguales incluso si el embed es bajo.
      const columns = Math.min(73, Math.max(15, Math.floor(width / 17)));
      const rows = Math.ceil(DAYS / columns);
      const unit = Math.min(width / columns, height / rows);
      const gap = Math.min(5, unit * 0.26);
      const size = Math.min((width - gap * (columns - 1)) / columns,
                            (height - gap * (rows - 1)) / rows);
      calendar.style.gridTemplateColumns = `repeat(${columns}, ${size}px)`;
      calendar.style.gridAutoRows = `${size}px`;
      calendar.style.gap = `${gap}px`;
    }
    update();
    resize();
    new ResizeObserver(resize).observe(document.documentElement);
    // Se actualiza al cambiar el día (máximo 1 segundo después) y al reabrir.
    setInterval(update, 1000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) update();
    });
    window.addEventListener('pageshow', update);
  </script>
</body>
</html>
